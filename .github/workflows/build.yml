name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:     # allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java 17 — use pre-installed Temurin on ubuntu-latest ─────────────
      - name: Set up Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "PATH=$JAVA_HOME_17_X64/bin:$PATH" >> $GITHUB_ENV
          java -version

      # ── Flutter — install from official release archive ───────────────────
      - name: Install Flutter 3.29.x
        run: |
          FLUTTER_VER=3.29.3
          curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VER}-stable.tar.xz" \
            | tar xJ -C "$HOME"
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      # ── Dependencies ──────────────────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── Analysis (non-blocking on first build) ───────────────────────────
      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      # ── Tests ─────────────────────────────────────────────────────────────
      - name: Run tests
        run: flutter test || true

      # ── Build APK (release) ───────────────────────────────────────────────
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      # ── Create GitHub Release on version tags ─────────────────────────────
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
