plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.ai_assistant"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.ai_assistant"
        minSdk 26          // Cactus requires API 24+; 26 gives us JobIntentService
        targetSdk 35
        versionCode flutter.versionCode
        versionName flutter.versionName

        // ABI filtering is handled by --split-per-abi in the build command
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug   // CI: replace with keystore
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // Required for GGUF model file packaging
    aaptOptions {
        noCompress "gguf", "bin"
    }
}

flutter {
    source "../.."
}

dependencies {
    // Prebuilt llama.cpp native library for Android (arm64-v8a, armeabi-v7a, x86_64)
    // Downloaded from: https://github.com/netdur/llama_cpp_dart/releases/tag/v0.9.0-dev.6
    implementation fileTree(dir: 'libs', include: ['*.aar'])
}
