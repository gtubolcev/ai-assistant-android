name: ai_assistant
description: Offline-first AI assistant with on-device LFM2.5 inference and MCP tool support.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.7.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # On-device LLM inference (llama_cpp_dart — GGUF via llama.cpp, prebuilt AAR)
  llama_cpp_dart: ^0.9.0-dev.7

  # State management
  provider: ^6.1.2

  # HTTP for web fetch tool and CalDAV
  http: ^1.2.1

  # XML parsing for CalDAV PROPFIND/REPORT responses
  xml: ^6.5.0

  # Markdown rendering for assistant responses
  flutter_markdown: ^0.7.3

  # Shared preferences for settings persistence
  shared_preferences: ^2.3.2

  # URL launcher for share-sheet integration
  url_launcher: ^6.3.0

  # Connectivity check (for cloud fallback)
  connectivity_plus: ^6.0.3

  # MCP client (StreamableHTTP transport, no archive dependency)
  mcp_dart: ^2.1.1

  # File system paths (getApplicationDocumentsDirectory, getExternalStorageDirectory)
  path_provider: ^2.1.4

  # File picker — lets user browse and select a .gguf model file
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
